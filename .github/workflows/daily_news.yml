name: Generar y Desplegar Edición Diaria

on:
  schedule:
    # Se ejecuta todos los días a las 06:00 UTC (07:00 CET / 08:00 CEST)
    - cron: '0 6 * * *'
  push:
    branches:
      - main
  workflow_dispatch: # Permite lanzarlo manualmente desde la pestaña Actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar generador de noticias con Gemini (si GEMINI_API_KEY está presente)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY detectada. Generando nueva edición..."
            python generator.py
          else
            echo "Aviso: GEMINI_API_KEY no configurada en Secrets. Se desplegará el public/data.json existente."
          fi

      - name: Guardar nuevo public/data.json en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: actualizar edición diaria $(date +'%Y-%m-%d')"
            git push
          else
            echo "Sin cambios en public/data.json"
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de la carpeta public/
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
